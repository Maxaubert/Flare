[package]
name = "flare-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "flare-e2e"
path = "src/main.rs"

[dependencies]
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
png.workspace = true
flare-e2e-proto = { path = "../../crates/flare-e2e-proto" }
flare-win = { path = "../../crates/flare-win" }
flare-agent = { path = "../../crates/flare-agent" }
flare-update = { path = "../../crates/flare-update" }
flare-diag = { path = "../../crates/flare-diag" }
flare-render = { path = "../../crates/flare-render" }
flare-tabs = { path = "../../crates/flare-tabs" }
flare-settings = { path = "../../crates/flare-settings" }
flare-dictation = { path = "../../crates/flare-dictation" }
flare-ctl = { path = "../../crates/flare-ctl" }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# macOS (rule 331): process groups and signals, the window server's list, the frontmost app, the pasteboard.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true
objc2-core-foundation.workspace = true

[lints]
workspace = true
