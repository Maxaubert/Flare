<!doctype html><html><head><meta charset="utf-8"><title>New tab split button</title><style>
:root{--ground:#171717;--side:#0a0a0a;--text:#dedacf;--soft:#c2bfb5;--dim:#929089;--line:#ffffff17;--btn:#161716;--hov:#222321}
*{box-sizing:border-box}body{margin:0;background:#050505;color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif;padding:24px}
h1{font-size:18px;font-weight:600;margin:0 0 4px}p.sub{color:var(--dim);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:16px}
.card{background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:14px}
.name{font-weight:600}.name span{color:var(--dim);font-weight:400}.desc{color:var(--dim);font-size:12.5px;margin:2px 0 12px}
.side{background:var(--side);padding:12px;border-radius:6px;position:relative;width:300px;height:330px;display:flex;flex-direction:column;justify-content:flex-end}
.btn{height:42px;display:flex;align-items:stretch;background:var(--btn);border:1px solid #ffffff12;border-radius:8px;color:var(--text);font-size:15px;overflow:hidden}
.main{flex:1;display:flex;align-items:center;justify-content:center;gap:10px}.main:hover,.arr:hover{background:var(--hov)}
.arr{width:40px;display:flex;align-items:center;justify-content:center;color:var(--soft)}
.sep{border-left:1px solid #ffffff14}
.sepshort{position:relative}.sepshort::before{content:"";position:absolute;left:0;top:10px;bottom:10px;border-left:1px solid #ffffff1c}
.menu{position:absolute;left:12px;right:12px;bottom:62px;background:#1c1c1b;border:1px solid #ffffff1a;border-radius:8px;padding:4px;box-shadow:0 8px 24px #0008}
.mi{height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:5px;color:var(--soft);font-size:13px}
.mi:first-child{color:var(--text)}.mi:hover{background:#ffffff0d}.mi small{color:var(--dim);margin-left:auto;font-size:11.5px}
.hr{height:1px;background:#ffffff12;margin:4px 6px}
.strip{margin-top:12px;height:40px;background:var(--ground);border:1px solid #ffffff12;border-radius:6px;display:flex;align-items:center;padding:0 6px;gap:6px;width:300px}
.tab{height:30px;flex:1;background:#1f1f1e;border-radius:5px;display:flex;align-items:center;padding:0 10px;font-size:12.5px;color:var(--soft)}
.plus{height:30px;display:flex;align-items:stretch;border-radius:5px;color:var(--soft);overflow:hidden}
.plus>div{display:flex;align-items:center;justify-content:center}.plus>div:hover{background:var(--hov)}
svg{flex:none}
</style></head><body>
<h1>New tab button with a folder arrow: pick one</h1>
<p class="sub">Click the main part: a tab in your default folder. Click the arrow: the menu (open here). Right-click no longer opens it. The strip's + gets the same arrow.</p>
<div class="grid" id="g"></div>
<script>
const P='<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
const C='<svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CU='<svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 7.5l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const F='<svg width="14" height="14" viewBox="0 0 16 16"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 1.5h4.5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>';
const menu=`<div class="menu"><div class="mi">${F}Choose a folder…</div><div class="hr"></div>
<div class="mi">${F}Documents<small>~\\Documents</small></div><div class="mi">${F}Downloads<small>~\\Downloads</small></div>
<div class="mi">${F}Desktop<small>~\\Desktop</small></div><div class="mi">${F}Admin<small>user folder</small></div></div>`;
const V=[
 ['N1','arrow with a full divider','A thin line splits the button top to bottom.','sep',C],
 ['N2','arrow with a short divider','The line stops short of the edges, quieter.','sepshort',C],
 ['N3','arrow, no divider','Just the arrow; it lights up on its own when hovered.','',C],
 ['N4','short divider, arrow points up','Points at where the menu opens (above the button).','sepshort',CU],
];
document.getElementById('g').innerHTML=V.map(([k,n,d,cls,ch])=>`<div class="card"><div class="name">${k} <span>${n}</span></div><div class="desc">${d}</div>
<div class="side">${menu}<div class="btn"><div class="main">${P}New tab</div><div class="arr ${cls}">${ch}</div></div></div>
<div class="strip"><div class="tab">Flare</div><div class="tab">Thrasher</div><div class="plus"><div style="width:28px">${P}</div><div class="${cls}" style="width:18px">${ch}</div></div></div></div>`).join('');
</script></body></html>
