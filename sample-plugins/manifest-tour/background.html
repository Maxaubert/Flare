<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'">
<title>Tour background</title>
</head>
<body>
<script>
// The background page of the protocol 2 sample: it runs while the plugin is on, in a hidden view, whatever tab is
// shown. A plugin with a background page has its tools answered here, not by a panel, so this page keeps the list
// that add_item adds to and answers with how long it is.
(function () {
  var flare = window.flare;
  if (!flare) { return; }
  var items = [];
  flare.on('tool', function (call) {
    if (call.tool !== 'add_item') {
      flare.respond(call.callId, null, 'no tool called ' + call.tool);
      return;
    }
    var text = call.input && typeof call.input.text === 'string' ? call.input.text.trim() : '';
    if (text.length < 1 || text.length > 200) {
      flare.respond(call.callId, null, 'text must be 1 to 200 characters');
      return;
    }
    items.push(text);
    flare.respond(call.callId, { count: items.length });
  });
})();
</script>
</body>
</html>
