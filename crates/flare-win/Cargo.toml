[package]
name = "flare-win"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[dependencies]
flare-theme = { path = "../flare-theme" }
flare-settings = { path = "../flare-settings" }
flare-shells = { path = "../flare-shells" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
rfd.workspace = true
raw-window-handle.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
windows.workspace = true

[target.'cfg(not(windows))'.dependencies]
flare-proc = { path = "../flare-proc" }
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true
objc2-core-foundation.workspace = true
block2.workspace = true
dispatch2.workspace = true

[dev-dependencies]
tempfile.workspace = true

# AppKit checks that need the main thread (a window that is never shown): a small harness of its own
# speaks the libtest list protocol nextest uses. Empty off macOS.
[[test]]
name = "appkit"
path = "tests/appkit.rs"
harness = false

[lints]
workspace = true
