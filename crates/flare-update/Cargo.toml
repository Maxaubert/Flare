[package]
name = "flare-update"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[features]
default = []
# The updater is compiled out of every default build (owner, 2026-10-17). FakeFeed, NullFeed and
# RefusingFeed are always compiled; only the real GitHub source sits behind this feature.
live-updates = []

[dependencies]
velopack.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

# The Mac update test (tests/mac_update.rs) samples the window server's list: nothing it runs may show a window.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-foundation.workspace = true

[lints]
workspace = true
