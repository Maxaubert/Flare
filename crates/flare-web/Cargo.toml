[package]
name = "flare-web"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[dependencies]
flare-surfaces = { path = "../flare-surfaces" }
flare-mods = { path = "../flare-mods" }
log.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com.workspace = true
windows.workspace = true
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
flare-cef = { path = "../flare-cef" }
libc.workspace = true
serde_json.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true

[dev-dependencies]
serde_json.workspace = true

# The web host tests' browser process and its CEF helper, run inside a dev bundle (macOS only; on Windows they only
# say so).
[[bin]]
name = "flare-web-cef-probe"
path = "src/bin/cef_probe.rs"

[[bin]]
name = "flare-web-cef-helper"
path = "src/bin/cef_helper.rs"

[lints]
workspace = true
