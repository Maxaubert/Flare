[package]
name = "flare"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
flare-theme = { path = "../flare-theme" }
flare-render = { path = "../flare-render" }
flare-term = { path = "../flare-term" }
flare-shells = { path = "../flare-shells" }
flare-tabs = { path = "../flare-tabs" }
flare-settings = { path = "../flare-settings" }
flare-win = { path = "../flare-win" }
flare-agent = { path = "../flare-agent" }
flare-diag = { path = "../flare-diag" }
flare-help = { path = "../flare-help" }
flare-surfaces = { path = "../flare-surfaces" }
flare-mods = { path = "../flare-mods" }
flare-convo = { path = "../flare-convo" }
flare-web = { path = "../flare-web" }
flare-ctl = { path = "../flare-ctl" }
flare-dictation = { path = "../flare-dictation" }
flare-e2e-proto = { path = "../flare-e2e-proto" }
slint.workspace = true
wgpu.workspace = true
pollster.workspace = true
png.workspace = true
image.workspace = true
log.workspace = true
env_logger.workspace = true
serde_json.workspace = true
raw-window-handle.workspace = true
flare-update = { path = "../flare-update" }
velopack.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# The process memory and the installed RAM off Windows (macOS: proc_pid_rusage, sysctl).
[target.'cfg(not(windows))'.dependencies]
flare-proc = { path = "../flare-proc" }

[features]
default = []
# Off in every default build; the release workflow turns it on only when the repository is public
# and the FLARE_LIVE_UPDATES variable says so (M9 Task 28).
live-updates = ["flare-update/live-updates"]

[dev-dependencies]
# The agent's side of the control channel, for the end-to-end channel tests (appctl/tests/ctl_socket_tests.rs).
flare-mcp = { path = "../flare-mcp" }
tempfile.workspace = true
zip.workspace = true
sha2.workspace = true

[build-dependencies]
slint-build.workspace = true

[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true
