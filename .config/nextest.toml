# The slowest-frame budget test measures wall-clock latency of the UI thread, which any other test
# running at the same time on a small runner inflates. It takes every slot, so it runs alone.
[[profile.default.overrides]]
filter = 'test(find_and_a_big_scrollback_never_hold_the_window)'
threads-required = "num-cpus"

# The emulator's lock-hold and screen-read budgets measure wall-clock time of a debug build; with every
# other test running beside them a shared macOS runner starved the hold to a 41 ms p90 (limit 40) for a
# copy that takes a few ms alone. The 100 MB flood's worst snapshot is the same kind of budget (a sampler thread
# timing the lock against the parser's thread): beside the whole suite on a slow runner it read 384 ms (limit 250).
# They take every slot too, so they measure the code, not the neighbours.
[[profile.default.overrides]]
filter = 'package(flare-term) & (test(snapshot_holds_the_lock_under_1_ms) | test(reading_a_huge_screen_full_of_addresses_stays_cheap) | test(a_100_mb_flood_keeps_snapshots_fast_and_arrives_complete))'
threads-required = "num-cpus"

# The Mac CEF engine probes start a whole Chromium (browser, GPU, network and renderer processes) and shut it down.
# Beside the whole suite on a three-core macOS runner the paint probe took 26 s instead of 6 to 13 and its process
# exited 2 during the engine's shutdown, after every check had passed (run 43054686157, main 794a9a28); alone it passes every
# time. The two short probes (paint, cdp: about 5 s each alone) take every slot, so they measure the engine, not the
# neighbours; the 40 s runaway probe keeps sharing. A failure now prints the probe's stderr.
[[profile.default.overrides]]
filter = 'package(flare-cef) & binary(engine_macos) & (test(a_windowless_page_paints) | test(the_devtools_methods))'
threads-required = "num-cpus"
