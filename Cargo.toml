[workspace]
resolver = "3"
members = [
    "crates/flare",
    "crates/flare-render",
    "crates/flare-term",
    "crates/flare-shells",
    "crates/flare-agent",
    "crates/flare-theme",
    "crates/flare-settings",
    "crates/flare-dictation",
    "crates/flare-update",
    "crates/flare-win",
    "crates/flare-diag",
    "tools/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Flare-Proprietary"
rust-version = "1.99"

[workspace.lints.rust]
# Unsafe is allowed only where a SAFETY comment explains it (Win32 glue, mostly).
unsafe_code = "allow"

[workspace.lints.clippy]
# Pedantic stays off; the default set plus a check that every unsafe block is explained.
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg-wgpu", "renderer-software", "unstable-wgpu-30", "accessibility"] }
slint-build = "=1.18.1"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "dx12", "wgsl", "parking_lot"] }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
unicode-width = "=0.2.2"
png = "=0.18.1"
pollster = "=1.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
log = "=0.4.34"
env_logger = "=0.11.11"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
