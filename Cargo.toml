[workspace]
resolver = "3"
members = [
    "crates/flare",
    "crates/flare-render",
    "crates/flare-term",
    "crates/flare-shells",
    "crates/flare-agent",
    "crates/flare-theme",
    "crates/flare-settings",
    "crates/flare-dictation",
    "crates/flare-update",
    "crates/flare-win",
    "crates/flare-diag",
    "crates/flare-tabs",
    "tools/e2e",
    "tools/material-spike",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Flare-Proprietary"
rust-version = "1.99"

[workspace.lints.rust]
# Unsafe is allowed only where a SAFETY comment explains it (Win32 glue, mostly).
unsafe_code = "allow"

[workspace.lints.clippy]
# Pedantic stays off; the default set plus a check that every unsafe block is explained.
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg-wgpu", "renderer-software", "unstable-wgpu-30", "unstable-winit-030", "accessibility"] }
slint-build = "=1.18.1"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "dx12", "wgsl", "parking_lot"] }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
unicode-width = "=0.2.2"
png = "=0.18.1"
pollster = "=1.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
log = "=0.4.34"
env_logger = "=0.11.11"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_Security_Authorization", "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse"] }
alacritty_terminal = { version = "=0.26.0", default-features = false }
portable-pty = "=0.9.0"
regex = "=1.13.1"
memchr = "=2.8.3"
base64 = "=0.22.1"
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rfd = { version = "=0.17.2", default-features = false }
raw-window-handle = "=0.6.2"
