[workspace]
resolver = "3"
members = [
    "crates/flare",
    "crates/flare-render",
    "crates/flare-term",
    "crates/flare-shells",
    "crates/flare-agent",
    "crates/flare-theme",
    "crates/flare-settings",
    "crates/flare-dictation",
    "crates/flare-update",
    "crates/flare-win",
    "crates/flare-diag",
    "crates/flare-tabs",
    "crates/flare-help",
    "crates/flare-surfaces",
    "crates/flare-web",
    "crates/flare-cef",
    "crates/flare-ctl",
    "crates/flare-mcp",
    "crates/flare-convo",
    "crates/flare-mods",
    "crates/flare-proc",
    "crates/flare-e2e-proto",
    "tools/e2e",
    "tools/material-spike",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Flare-Proprietary"
rust-version = "1.99"

[workspace.lints.rust]
# Unsafe is allowed only where a SAFETY comment explains it (Win32 glue, mostly).
unsafe_code = "allow"

[workspace.lints.clippy]
# Pedantic stays off; the default set plus a check that every unsafe block is explained.
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg-wgpu", "renderer-software", "unstable-wgpu-30", "unstable-winit-030", "accessibility"] }
slint-build = "=1.18.1"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "dx12", "metal", "wgsl", "parking_lot"] }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
unicode-width = "=0.2.2"
png = "=0.18.1"
# The panel image viewer decodes png, jpeg, gif, bmp, webp and ico on a worker (Surfaces stage 1).
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
pollster = "=1.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
log = "=0.4.34"
env_logger = "=0.11.11"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_Security_Authorization", "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Ole", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Wdk_System_Threading", "Win32_System_Registry", "Win32_System_Time", "Win32_System_Diagnostics_Debug", "Win32_Media", "Win32_Media_Audio", "Win32_Security_Cryptography", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
windows = { version = "=0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Media_Control", "Foundation", "Foundation_Collections", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "UI_Notifications", "Data_Xml_Dom"] }
alacritty_terminal = { version = "=0.26.0", default-features = false }
portable-pty = "=0.9.0"
# The macOS process table (libproc, sysctl, kqueue) and signals; the same version portable-pty pulls in.
libc = "=0.2.191"
regex = "=1.13.1"
memchr = "=2.8.3"
base64 = "=0.22.1"
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
rusty-leveldb = "=4.0.1"
unicode-normalization = "=0.1.25"
fancy-regex = "=0.19.2"
rfd = { version = "=0.17.2", default-features = false }
raw-window-handle = "=0.6.2"
# The macOS window chrome (port phase 3): AppKit through objc2, the versions winit and wgpu already pull in.
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
block2 = "=0.6.2"
# The main queue on macOS (the eyedropper hands its sampler to the main thread): the version objc2 already pulls in.
dispatch2 = "=0.3.1"
# The macOS web engine (port phase 5, the phase 1 verdict: CEF): tauri-apps/cef-rs. 156.2.0+156.0.14 (2026-10-25,
# CEF 156.0.14, Chromium 156.0.8078.48) is the newest release at least two weeks old on 2026-11-08. The sys crate is
# pinned beside it so the bindings and the CEF binary it downloads always agree (cef asks only for ^156.2; Cargo.lock
# holds the full 156.2.0+156.0.14). The binary
# is fetched by cef-dll-sys's build script into `$CEF_PATH/<version>` (set it to ~/Library/Caches/flare-cef) or the
# target dir, never the repo. macOS only: no other target pulls either crate.
cef = { version = "=156.2.0", default-features = false, features = ["sandbox"] }
cef-dll-sys = { version = "=156.2.0", default-features = false, features = ["sandbox"] }
# The window server's list (the screen rule's evidence in the CEF tests): the version objc2-app-kit already pulls in.
objc2-core-graphics = "=0.3.2"
objc2-core-foundation = "=0.3.2"
velopack = "=1.2.161"
embed-resource = "=3.0.11"
ureq = "=3.4.2"
libloading = "=0.8.9"
# The web panel's browser (Surfaces stage 3): the WebView2 COM bindings. 0.39.1 (2026-03-11) is well over two
# weeks old. Its sys crate links Microsoft's STATIC loader, so no WebView2Loader.dll ships beside flare.exe.
webview2-com = "=0.39.1"
# The GPU pack's unzip (M8 D5). 9.0.0 (2026-10-09) is the OLDEST release patched for RUSTSEC-2026-0367/0368/0369
# (every one says patched >= 9.0.0; 9.0.0-pre3 is NOT). No fixed release is 14 days old yet (9.0.0 is 10 days old on
# 2026-10-19), so the age rule gives way to the advisory rule. Never 8.6 (velopack's; ignored in deny.toml for it only).
# Markdown views (2026-11-10): the compiled page's parser, with no HTML writer of its own (Flare escapes every tag itself).
# 0.13.4 was already in the lockfile through Slint (MIT). 0.13.6 (2026-10-30) is the OLDEST release patched for both
# RUSTSEC-2026-0414 (>= 0.13.5) and RUSTSEC-2026-0433 (>= 0.13.6); it is 11 days old on 2026-11-10, so the age rule
# gives way to the advisory rule, as for zip below. Slint's i-slint-common shares this copy.
pulldown-cmark = { version = "=0.13.6", default-features = false }
zip = { version = "=9.0.0", default-features = false, features = ["deflate"] }
