[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[advisories]
version = 2
# RUSTSEC-2026-0192 (ttf-parser unmaintained) reaches us only through cosmic-text 0.19.0 (pinned) -> fontdb 0.23.0.
# No patched ttf-parser exists, and cosmic-text 0.19.0 (the latest on 2026-10-17) requires fontdb ^0.23. fontdb 0.24
# no longer uses ttf-parser (Slint already pulls 0.24 through usvg), so the fix is a cosmic-text release on fontdb
# 0.24. It is an unmaintained notice, not a vulnerability. Drop this entry when cosmic-text moves off fontdb 0.23
# (check on each cosmic-text bump).
#
# The five entries below (four zip, one derivative) come only through velopack 1.2.161 (the newest release older than two weeks on 2026-10-18).
# velopack 1.3.39 moves to zip ^9 but was published 2026-10-17 as a pre-release build, too new to adopt. zip is used
# only to unpack an update package, and the updater ships switched OFF until the repo is public (O19). BEFORE the
# updater is turned on, bump velopack to a release on zip >= 9 and drop these four entries; the release workflow runs
# tools/release/check-advisory-gate.ps1 -Live and fails a live-updates build while they remain.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, pulled by cosmic-text 0.19.0 via fontdb; no safe upgrade" },
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 ONLY, via velopack 1.2.161 (updater, off until public; bump velopack first). flare-dictation uses zip 9.0.0, proven clean with these three ignores removed (2026-10-19)" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 ONLY, via velopack 1.2.161 (updater, off until public; bump velopack first). flare-dictation uses zip 9.0.0, proven clean with these three ignores removed (2026-10-19)" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 ONLY, via velopack 1.2.161 (updater, off until public; bump velopack first). flare-dictation uses zip 9.0.0, proven clean with these three ignores removed (2026-10-19)" },
    { id = "RUSTSEC-2026-0429", reason = "zip 8.6.0 ONLY, via velopack 1.2.161 (updater, off until public; bump velopack first). Patched >= 9.0.0, so flare-dictation's zip 9.0.0 is clean (2026-11-10)" },
    { id = "RUSTSEC-2024-0388", reason = "derivative unmaintained notice via velopack 1.2.161; not a vulnerability" },
    # 2026-11-17: four more zip advisories, the first three on 8.6.0 ONLY (patched >= 9.0.0), the fourth on 8.6.0 and
    # 9.0.0 (patched >= 9.0.5). Flare's own zip is now =9.0.5, so these ignores cover velopack's 8.6.0 copy alone.
    # velopack 1.2.161 needs zip ^8.6 (no [patch] can lift it to 9); the only velopack on zip ^9 is the 1.3.39
    # pre-release, which would also move vpk in both release workflows. None of the four reaches velopack's use:
    # it builds zip with `deflate` only (no `aes-crypto`, no `legacy-zip`) and reads with ZipArchive::by_index, never
    # ZipArchive::extract and never ZipStreamReader. The advisory gate (tools/release/check-advisory-gate.ps1) holds
    # them like the four above.
    { id = "RUSTSEC-2026-0545", reason = "zip 8.6.0 ONLY, via velopack 1.2.161: AES entries; needs the aes-crypto feature, not built (2026-11-17)" },
    { id = "RUSTSEC-2026-0546", reason = "zip 8.6.0 ONLY, via velopack 1.2.161: ZipArchive::extract symlinks; velopack never calls extract (2026-11-17)" },
    { id = "RUSTSEC-2026-0547", reason = "zip 8.6.0 ONLY, via velopack 1.2.161: legacy Shrink/Reduce/Implode; needs the legacy-zip feature, not built (2026-11-17)" },
    { id = "RUSTSEC-2026-0548", reason = "zip 8.6.0 ONLY, via velopack 1.2.161: ZipStreamReader names; velopack reads with ZipArchive only. Flare's zip is 9.0.5, patched (2026-11-17)" },
    # chrono is unmaintained (no patched release, not a vulnerability). It reaches us only through Slint's i-slint-core
    # (1.18.1, and 1.19.0 of 2026-11-16 still requires chrono ^0.4); Flare has no direct use. Drop this when Slint
    # moves off chrono (check on each Slint bump). Added 2026-11-17.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, pulled by slint 1.18.1 via i-slint-core; no safe upgrade, not a vulnerability" },
    # pin-utils was archived upstream on 2026-10-01 (unmaintained notice, no patched release). It reaches us only through
    # spin_on 0.1.1 <- slint-build / slint-macros 1.18.1, at build time. Drop this when Slint moves off spin_on
    # (check on each Slint bump). Added 2026-11-10.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained, pulled by slint 1.18.1 via spin_on; no safe upgrade, not a vulnerability" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

# Flare's own crates are proprietary and unpublished.
[licenses.private]
ignore = true

# Slint is used under its royalty-free desktop licence (attribution: "Made with Slint", About page, M7).
# Only the royalty-free term is allowed for these crates; GPL-3.0 is never allowed globally.
[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "slint"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "slint-build"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "slint-macros"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-backend-selector"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-backend-winit"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-common"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-compiler"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-core"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-core-macros"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-renderer-femtovg"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-renderer-software"

# webpki-roots (via ureq via velopack) ships Mozilla's CA list under CDLA-Permissive-2.0, a permissive data licence.
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-roots"

# libbz2-rs-sys (bzip2 via download-cef, the build script of cef-dll-sys on macOS) unpacks the CEF archive at BUILD
# time; nothing of it ships. Its licence is the original bzip2 one (BSD-style, permissive), allowed for this crate only.
[[licenses.exceptions]]
allow = ["bzip2-1.0.6"]
crate = "libbz2-rs-sys"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
