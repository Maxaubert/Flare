[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[advisories]
version = 2
# RUSTSEC-2026-0192 (ttf-parser unmaintained) reaches us only through cosmic-text 0.19.0 (pinned) -> fontdb 0.23.0.
# No patched ttf-parser exists, and cosmic-text 0.19.0 (the latest on 2026-10-17) requires fontdb ^0.23. fontdb 0.24
# no longer uses ttf-parser (Slint already pulls 0.24 through usvg), so the fix is a cosmic-text release on fontdb
# 0.24. It is an unmaintained notice, not a vulnerability. Drop this entry when cosmic-text moves off fontdb 0.23
# (check on each cosmic-text bump).
#
# The four entries below come only through velopack 1.2.161 (the newest release older than two weeks on 2026-10-18).
# velopack 1.3.39 moves to zip ^9 but was published 2026-10-17 as a pre-release build, too new to adopt. zip is used
# only to unpack an update package, and the updater ships switched OFF until the repo is public (O19). BEFORE the
# updater is turned on, bump velopack to a release on zip >= 9 and drop these four entries; the release workflow runs
# tools/release/check-advisory-gate.ps1 -Live and fails a live-updates build while they remain.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, pulled by cosmic-text 0.19.0 via fontdb; no safe upgrade" },
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 ONLY, via velopack 1.2.161 (updater, off until public; bump velopack first). flare-dictation uses zip 9.0.0, proven clean with these three ignores removed (2026-10-19)" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 ONLY, via velopack 1.2.161 (updater, off until public; bump velopack first). flare-dictation uses zip 9.0.0, proven clean with these three ignores removed (2026-10-19)" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 ONLY, via velopack 1.2.161 (updater, off until public; bump velopack first). flare-dictation uses zip 9.0.0, proven clean with these three ignores removed (2026-10-19)" },
    { id = "RUSTSEC-2024-0388", reason = "derivative unmaintained notice via velopack 1.2.161; not a vulnerability" },
    { id = "RUSTSEC-2026-0429", reason = "zip 8.6.0 ONLY, via velopack 1.2.161 (updater, off until public; bump velopack first), same as 0367-0369. Published 2026-11-08; flare-dictation is on zip 9.x, the fixed line" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained notice (2026-11-08), via spin_on in Slint 1.18.1's skia renderer and slint-build; not a vulnerability, no safe upgrade until Slint drops it" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

# Flare's own crates are proprietary and unpublished.
[licenses.private]
ignore = true

# Slint is used under its royalty-free desktop licence (attribution: "Made with Slint", About page, M7).
# Only the royalty-free term is allowed for these crates; GPL-3.0 is never allowed globally.
[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "slint"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "slint-build"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "slint-macros"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-backend-selector"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-backend-winit"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-common"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-compiler"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-core"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-core-macros"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-renderer-femtovg"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-renderer-software"

# webpki-roots (via ureq via velopack) ships Mozilla's CA list under CDLA-Permissive-2.0, a permissive data licence.
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-roots"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
