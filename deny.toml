[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

# Flare's own crates are proprietary and unpublished.
[licenses.private]
ignore = true

# Slint is used under its royalty-free desktop licence (attribution: "Made with Slint").
# When the Slint dependency lands in Milestone 1, add it here, for example:
# exceptions = [{ allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "slint" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
