name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rustup 1.28+ no longer installs on `rustup show`; this reads rust-toolchain.toml.
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: No em-dashes
        shell: bash
        run: bash tools/release/check-no-emdash.sh
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy with the updater built in (the flip must keep compiling)
        run: cargo clippy -p flare-update -p flare --all-targets --features flare/live-updates,flare-update/live-updates -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --no-tests=pass --no-fail-fast
      - name: Deny
        run: cargo deny check

  # The macOS port (docs/superpowers/specs/2026-11-08-macos-port.md, rule 227): the same gates on macos-latest.
  # Tests that encode Windows-only behaviour are gated in the source (cfg(windows) or an ignore with the phase).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # rustup 1.28+ no longer installs on `rustup show`; this reads rust-toolchain.toml.
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      # The CEF engine (crates/flare-cef, port phase 5, rule 251): cef-dll-sys builds CEF's C++ wrapper with CMake and
      # Ninja and downloads the pinned CEF build into CEF_PATH, cached between runs (outside the checkout).
      - name: CEF build tools and cache folder
        shell: bash
        run: |
          brew install ninja cmake || true
          echo "CEF_PATH=$HOME/Library/Caches/flare-cef" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/flare-cef
          key: cef-macos-arm64-156.0.14
      - name: No em-dashes
        shell: bash
        run: bash tools/release/check-no-emdash.sh
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy with the updater built in (the flip must keep compiling)
        run: cargo clippy -p flare-update -p flare --all-targets --features flare/live-updates,flare-update/live-updates -- -D warnings
      # The kernel lets a background process's timers run up to 100 ms late (kern.timer_coalesce_bg_ns_max), and the
      # runner's test processes are background ones: a 100 ms sleep in a debounce test came back after the 200 ms
      # wait it was measured against, run after run. Coalescing is off for the tests, as for the E2E run.
      - name: Timer coalescing off
        shell: bash
        run: |
          sudo sysctl -w kern.timer.coalescing_enabled=0 || true
          sysctl kern.timer.coalescing_enabled kern.timer_coalesce_bg_ns_max || true
      - name: Tests
        run: cargo nextest run --workspace --no-tests=pass --no-fail-fast
      # The Mac's speech engine (port phase 7, rule 315): whisper.cpp built with Metal from its pinned commit and
      # tree, then one real pass with the pinned tiny model and the Parakeet host loading the built libraries.
      - uses: actions/cache@v4
        with:
          path: vendor/macos
          key: whisper-macos-arm64-927cfce34f31707e17f2bff35c349632fb9e2c3a-v1
      - name: Speech engine with Metal (built from the pinned source)
        shell: bash
        run: bash tools/build-whisper-macos.sh vendor/macos/whisper vendor/macos/clips
      - name: The pinned tiny model (checked by size and SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          m=vendor/macos/models/ggml-tiny.bin
          sha=be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21
          if [ ! -f "$m" ] || [ "$(shasum -a 256 "$m" | cut -d' ' -f1)" != "$sha" ]; then
            mkdir -p vendor/macos/models
            curl -fsSL -o "$m.part" https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-tiny.bin
            [ "$(stat -f %z "$m.part")" = 77691713 ]
            [ "$(shasum -a 256 "$m.part" | cut -d' ' -f1)" = "$sha" ]
            mv "$m.part" "$m"
          fi
      - name: A real pass on the Mac's engine
        run: cargo nextest run -p flare-dictation --test metal_real --run-ignored only --no-fail-fast
      - name: Deny
        run: cargo deny check
