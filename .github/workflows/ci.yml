name: ci
on:
  push:
    # TEMPORARY (remove before merge): the Mac E2E branch runs CI on push while it has no PR.
    branches: [main, feat/macos-e2e-ci]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rustup 1.28+ no longer installs on `rustup show`; this reads rust-toolchain.toml.
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: No em-dashes
        shell: bash
        run: bash tools/release/check-no-emdash.sh
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy with the updater built in (the flip must keep compiling)
        run: cargo clippy -p flare-update -p flare --all-targets --features flare/live-updates,flare-update/live-updates -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --no-tests=pass --no-fail-fast
      - name: Deny
        run: cargo deny check

  # The macOS port (docs/superpowers/specs/2026-11-08-macos-port.md, rule 227): the same gates on macos-latest.
  # Tests that encode Windows-only behaviour are gated in the source (cfg(windows) or an ignore with the phase).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # rustup 1.28+ no longer installs on `rustup show`; this reads rust-toolchain.toml.
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      # The CEF engine (crates/flare-cef, port phase 5, rule 247): cef-dll-sys builds CEF's C++ wrapper with CMake and
      # Ninja and downloads the pinned CEF build into CEF_PATH, cached between runs (outside the checkout).
      - name: CEF build tools and cache folder
        shell: bash
        run: |
          brew install ninja cmake || true
          echo "CEF_PATH=$HOME/Library/Caches/flare-cef" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/flare-cef
          key: cef-macos-arm64-156.0.14
      - name: No em-dashes
        shell: bash
        run: bash tools/release/check-no-emdash.sh
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy with the updater built in (the flip must keep compiling)
        run: cargo clippy -p flare-update -p flare --all-targets --features flare/live-updates,flare-update/live-updates -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --no-tests=pass --no-fail-fast
      - name: Deny
        run: cargo deny check

  # The Mac E2E (rules 330 to 333, docs/e2e.md "macOS E2E"): the release app driven through its --e2e hook (a Unix
  # socket), an accessory app parked off every display; the harness fails a scenario that takes the keyboard or shows a
  # window. Its own job so the gates above stay as fast as they were. A Mac has no hidden desktop, so this runs only here.
  e2e-macos:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-release
      - name: CEF build tools and cache folder
        shell: bash
        run: |
          brew install ninja cmake || true
          echo "CEF_PATH=$HOME/Library/Caches/flare-cef" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/flare-cef
          key: cef-macos-arm64-156.0.14
      - name: Build the app, the MCP server and the harness (release)
        run: cargo build --release -p flare -p flare-mcp -p flare-e2e
      - name: The shells the scenarios use
        shell: bash
        run: |
          ls -l /usr/local/bin/pwsh /opt/homebrew/bin/pwsh 2>/dev/null || true
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' || echo "no pwsh: the PowerShell scenarios fail"
      - name: E2E
        shell: bash
        run: |
          mkdir -p e2e-out
          target/release/flare-e2e --list > e2e-out/list.txt
          set -o pipefail
          target/release/flare-e2e --exe target/release/flare --shots e2e-out/shots --keep $E2E_FILTER 2>&1 | tee e2e-out/e2e.log
        env:
          E2E_FILTER: ""
      - name: Collect the worlds' logs
        if: failure()
        shell: bash
        run: |
          for w in "${TMPDIR:-/tmp}"/flare-e2e-*; do
            [ -d "$w" ] || continue
            n=$(basename "$w")
            mkdir -p "e2e-out/worlds/$n"
            find "$w" -type f \( -name '*.log' -o -name '*.jsonl' -o -name '*.json' -o -name '*.txt' \) -size -5M \
              -exec cp {} "e2e-out/worlds/$n/" \; 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-macos
          path: e2e-out
          retention-days: 7
