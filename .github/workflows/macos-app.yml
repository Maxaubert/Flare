# The macOS app (port phase 8, rules 263 to 266): Flare.app and its DMG for Apple Silicon, macOS 15+, signed with the
# Developer ID, notarized and stapled, built by tools/release/mac/make-app.sh and kept as a workflow artifact. Run by
# hand for now; the Windows release (release.yml) is not touched. Publishing the Mac build with the release, and its
# Velopack osx-arm64 feed, come with the next phase 8 step.
#
# Secrets it needs (none are in the repository; see tools/release/mac/ci-keychain.sh): MACOS_CERT_P12_BASE64,
# MACOS_CERT_PASSWORD, APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID. Without them the job builds
# the ad hoc app only, and says so.
name: macos-app

on:
  workflow_dispatch:

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # No actions/cache for CEF here: the framework this job signs with the Developer ID is downloaded fresh into
      # the runner's temp folder, never restored from a cache another workflow could have written (rule 266).
      - name: CEF build tools and folder
        shell: bash
        run: |
          brew install ninja cmake || true
          echo "CEF_PATH=$RUNNER_TEMP/flare-cef" >> "$GITHUB_ENV"
      - name: Signing keychain (only when the secrets are set)
        id: keys
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "::notice::No signing secrets: Flare.app is built ad hoc and not notarized."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            bash tools/release/mac/ci-keychain.sh
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build, sign, notarize, staple, DMG
        shell: bash
        run: bash tools/release/mac/make-app.sh
      - name: Keep the app and the DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flare-macos-arm64
          path: |
            target/mac-release/*.dmg
            target/mac-release/*.zip
            target/mac-release/SHA256SUMS
            target/mac-release/notary-*.json
          if-no-files-found: warn
          retention-days: 30
      # Always, even when the keychain step failed halfway: whatever of the key material exists goes. Only the two
      # named files are removed, and only when the runner's temp folder is set.
      - name: Remove the signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${FLARE_SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$FLARE_SIGNING_KEYCHAIN" || true; fi
          if [ -n "${FLARE_NOTARY_KEY:-}" ]; then rm -f -- "$FLARE_NOTARY_KEY"; fi
          if [ -n "${RUNNER_TEMP:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ]; then
            rm -f -- "$RUNNER_TEMP/flare-cert.p12" "$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          fi
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
